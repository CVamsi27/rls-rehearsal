x-image: &app-image
  image: ${TENANTPROOF_IMAGE:-tenantproof:local}
  build: .
  init: true

services:
  db:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: tenantproof
      POSTGRES_PASSWORD: local_demo_admin
      TENANTPROOF_MIGRATION_PASSWORD: local_demo_migration
      TENANTPROOF_RUNTIME_PASSWORD: local_demo_runtime
    volumes:
      - data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tenantproof"]
      interval: 1s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app-image
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://tenantproof_migrator:local_demo_migration@db:5432/tenantproof
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app-image
    environment:
      DATABASE_URL: postgres://tenantproof_runtime:local_demo_runtime@db:5432/tenantproof
      LISTEN_HOST: 0.0.0.0
      TENANTPROOF_DEMO: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  data:
